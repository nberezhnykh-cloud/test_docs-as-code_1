metadata:
  version: "1.0"
  description: "Эталонная структура для документа 'Матрица ролей и полномочий пользователей Системы (Матрица)'"
  last_updated: "2026-07-07"

sections:
  - title: "Перечень терминов и определений"
    level: 1
    mandatory_phrases: # Проверка наличия обязательных фраз в разделе
    - "Используемые в документе термины и определения приведены в таблице"
    tables: # Проверка наличия таблиц в разделе
      - keyword: "Перечень терминов и определений" # Название таблицы, по которому будет осуществляться поиск
        columns: ["Термин", "Определение"] # Список обязательных столбцов таблицы, которые должны присутствовать в найденной таблице

  - title: "Перечень сокращений и обозначений"
    level: 1
    mandatory_phrases:
      - "Используемые в документе сокращения и обозначения приведены в таблице"
    tables:
      - keyword: "Перечень сокращений и обозначений"
        columns: ["Сокращение", "Обозначение"]

  - title: "Назначение и область действия документа"
    level: 1
    subsections:
      - title: "Область действия документа"
        level: 2
      - title: "Применение правил ролевого метода и назначения прав доступа"
        level: 2
      - title: "Принципы реализации правил разграничения доступа"
        level: 2

  - title: "Определение матрицы ролей и полномочий пользователей Системы"
    level: 1
    subsections:
      - title: "Перечень ролей пользователей Системы"
        level: 2
        mandatory_phrases:
          - "Персонал Системы разделяется на следующие категории пользователей"
          - "Роли пользователей в Системе, а также их обозначения в Системе и условные обозначения для данной матрицы ролей и полномочий приведены ниже"
        tables:
          - keyword: "Роли пользователей Системы"
            columns: ["№", "Название роли в Системе", "Категория", "Обозначение роли в Системе"]
      - title: "Описание полномочий пользователей Системы"
        level: 2
        mandatory_phrases:
          - "Полный перечень полномочий пользователей в Системе, приведен ниже"
        tables:
          - keyword: "Полномочия пользователей в Системе"
            columns: ["№", "Полномочия в Системе"]        
      - title: "Матрица ролей и полномочий пользователей Системы"
        level: 2
        mandatory_phrases:
          - "Полномочия пользователям в Системе наделяются согласно матрице, приведенной ниже"
        tables:
          - keyword: "Матрица ролей и полномочий пользователей в Системе"
            columns: ["№", "Полномочия в Системе", "Неавторизованный пользователь", "Авторизованный пользователь", "Редактор", "Администратор"]                
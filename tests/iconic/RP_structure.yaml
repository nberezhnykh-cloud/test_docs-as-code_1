metadata:
  version: "1.3"
  description: "Эталон с проверкой таблиц, рисунков и обязательных фраз"
  last_updated: "2026-07-06"

mandatory_texts: # Обязательные фразы (проверяются во всём документе)
  - "Информационная система «N»"
  - "Подсистема «M»"

sections:
  - title: "Перечень терминов и определений"
    level: 1
    mandatory_phrases: # Проверка наличия обязательных фраз в разделе
    - "Используемые в документе термины и определения приведены в таблице"
    tables: # Проверка наличия таблиц в разделе
      - keyword: "Перечень терминов и определений" # Название таблицы, по которому будет осуществляться поиск
        columns: ["Термин", "Определение"] # Список обязательных столбцов таблицы, которые должны присутствовать в найденной таблице

  - title: "Перечень сокращений и обозначений"
    level: 1
    mandatory_phrases: # Проверка наличия обязательных фраз в разделе
      - "Используемые в документе сокращения и обозначения приведены в таблице"
    tables: # Проверка наличия таблиц в разделе
      - keyword: "Перечень сокращений и обозначений" # Название таблицы, по которому будет осуществляться поиск
        columns: ["Сокращение", "Обозначение"] # Список обязательных столбцов таблицы, которые должны присутствовать в найденной таблице

  - title: "Общие положения"
    level: 1
    subsections:
      - title: "Область применения Системы"
        level: 2
        mandatory_phrases: # Проверка наличия обязательных фраз в подразделе
          - "Информационная система «N» предназначена для"
      - title: "Краткое описание возможностей Системы"
        level: 2
        mandatory_phrases: # Проверка наличия обязательных фраз в подразделе
          - "В настоящем руководстве рассмотрена подсистема «M» (далее – Подсистема), создание которой предусмотрено по этапу X государственного контракта от дд.мм.гггг № X на выполнение работ по созданию информационной системы: информационная система «N»."
          - "Система предназначена для"
      - title: "Требования к квалификации пользователей"
        level: 2
        mandatory_phrases: # Проверка наличия обязательных фраз в подразделе
          - "Пользователи Системы должны обладать квалификацией, обеспечивающей, как минимум"
          - "Для работы с Системой пользователи должны пройти подготовку в соответствии с требованиями настоящего документа"
      - title: "Перечень эксплуатационных документов, с которыми необходимо ознакомиться пользователю"
        level: 2
        mandatory_phrases: # Проверка наличия обязательных фраз в подразделе
          - "Перед началом работы с Системой пользователю рекомендуется ознакомиться с документами «Руководство пользователя» (XXX) (настоящим документом) и «Руководство администратора» (XXX)"

  - title: "Назначение и условия применения"
    level: 1
    subsections:
      - title: "Виды деятельности, функции, для автоматизации которых предназначена Система"
        level: 2
        mandatory_phrases: # Проверка наличия обязательных фраз в подразделе
          - "Система предназначена для"
          - "Полный список функций, автоматизируемых Системой в рамках X этапа Контракта, приведен в документе «Частное техническое задание на выполнение работ по созданию системы» (XXX)"
      - title: "Условия, при соблюдении которых обеспечивается применение Системы в соответствии с назначением"
        level: 2
        mandatory_phrases: # Проверка наличия обязательных фраз в подразделе
          - "Условием применения Системы является развернутый комплекс программно технических средств Системы в виртуальной среде Заказчика"
        subsections:
          - title: "Требования к программному обеспечению"
            level: 3
            mandatory_phrases: # Проверка наличия обязательных фраз в подразделе
              - "Для обеспечения возможности работы с клиентским ПО необходима установка на компьютерах пользователей следующего ПО:"
          - title: "Требования к клиентскому техническому обеспечению"
            level: 3
            mandatory_phrases: # Проверка наличия обязательных фраз в подразделе
              - "Требования к конфигурации технического обеспечения клиентской части представлены в таблице"
            tables: # Проверка наличия таблиц в подразделе
              - keyword: "Требования к клиентскому техническому обеспечению" # Название таблицы, по которому будет осуществляться поиск
                columns: ["Оборудование", "Минимальная конфигурация"] # Список обязательных столбцов таблицы, которые должны присутствовать в найденной таблице

  - title: "Подготовка к работе"
    level: 1
    subsections:
      - title: "Состав и содержание дистрибутивного носителя данных"
        level: 2
        mandatory_phrases: # Проверка наличия обязательных фраз в подразделе
          - "ПО Системы размещено на дистрибутивном носителе, состав которого описан"
          - "Для начала работы с ПО Системы требуется выполнить размещение компонентов ПО согласно инструкциям, приведенным в документе «Руководство администратора» (XXX)"
      - title: "Порядок загрузки данных и программ"
        level: 2
        mandatory_phrases: # Проверка наличия обязательных фраз в подразделе
          - "Работа пользователей с Системой не предусматривает предварительных операций загрузки данных"
      - title: "Порядок проверки работоспособности"
        level: 2
        mandatory_phrases: # Проверка наличия обязательных фраз в подразделе
          - "Для проверки работоспособности Системы необходимо выполнить действия, приведенные ниже"
        figures: # Проверка наличия рисунков в подразделе
          - keyword: "Главная страница Системы для неавторизованного пользователя" # Название рисунка, по которому будет осуществляться поиск

  - title: "Описание операций"
    level: 1

  - title: "Аварийные ситуации"
    level: 1

  - title: "Рекомендации по освоению"
    level: 1

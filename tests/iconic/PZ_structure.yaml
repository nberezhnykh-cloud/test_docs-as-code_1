metadata:
  version: "1.0"
  description: "Эталонная структура для документа 'Пояснительная записка (ПЗ)'"
  last_updated: "2026-07-07"

sections:
  - title: "Перечень терминов и определений"
    level: 1
    mandatory_phrases: # Проверка наличия обязательных фраз в разделе
    - "Используемые в документе термины и определения приведены в таблице"
    tables: # Проверка наличия таблиц в разделе
      - keyword: "Перечень терминов и определений" # Название таблицы, по которому будет осуществляться поиск
        columns: ["Термин", "Определение"] # Список обязательных столбцов таблицы, которые должны присутствовать в найденной таблице

  - title: "Перечень сокращений и обозначений"
    level: 1
    mandatory_phrases:
      - "Используемые в документе сокращения и обозначения приведены в таблице"
    tables:
      - keyword: "Перечень сокращений и обозначений"
        columns: ["Сокращение", "Обозначение"]

  - title: "Общие положения"
    level: 1
    subsections:
      - title: "Наименования проектируемой системы"
        level: 2
      - title: "Документы, на основании которых ведется проектирование"
        level: 2
      - title: "Перечень организаций, участвующих в разработке"
        level: 2
      - title: "Сроки выполнения стадий"
        level: 2
      - title: "Цели, назначение и области использования системы"
        level: 2
        subsections:
          - title: "Назначение системы"
            level: 3
          - title: "Цели выполнения работ"
            level: 3
          - title: "Задачи выполнения работ"
            level: 3
      - title: "Подтверждение соответствия проектных решений действующим нормам и правилам техники безопасности, пожаро- и взрывобезопасности"
        level: 2
      - title: "Сведения об использованных при проектировании нормативно-технических документах"
        level: 2
      - title: "Сведения о НИР, передовом опыте, изобретениях, использованных при разработке проекта"
        level: 2
      - title: "Очередность создания системы и объем каждой очереди"
        level: 2

  - title: "Описание процесса деятельности объекта автоматизации"
    level: 1

  - title: "Основные технические решения"
    level: 1
    subsections:
      - title: "Решения по структуре системы и ее подсистем, по взаимодействию подсистем, по связям между компонентами системы"
        level: 2
        subsections:
          - title: "Функциональная структура системы"
            level: 3
            subsections:
              - title: "Подсистема «Название подсистемы»"
                level: 4
                mandatory_phrases:
                  - "Описание компонентов и модулей Подсистемы приведено в таблице"
                tables:
                  - keyword: "Описание компонентов и модулей Подсистемы"
                    columns: ["№","Компонент/модуль", "Назначение"]
          - title: "Решения по разработке функций Системы"
            level: 3
            subsections:
              - title: "Решения по функции «Название функции»"
                level: 4

  - title: "Мероприятия по подготовке объекта автоматизации к вводу системы в действие"
    level: 1
    subsections:
      - title: "Мероприятия по приведению поступающей информации к виду, пригодному для обработки средствами вычислительной техники"
        level: 2
      - title: "Мероприятия по обучению и проверке квалификации персонала"
        level: 2
      - title: "Мероприятия по созданию необходимых подразделений и рабочих мест"
        level: 2
      - title: "Мероприятия по изменению объекта автоматизации"
        level: 2
      - title: "Дополнительные мероприятия"
        level: 2
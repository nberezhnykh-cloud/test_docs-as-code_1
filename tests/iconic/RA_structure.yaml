metadata:
  version: "1.0"
  description: "Эталонная структура для документа 'Руководство администратора'"
  last_updated: "2026-07-08"

# Глобальные фразы (проверяются во всём документе)
mandatory_texts:
  - "Государственная информационная система"
  - "Подсистема «M»"

sections:
  - title: "Перечень терминов и определений"
    level: 1
    tables:
      - keyword: "Перечень терминов и определений"
        columns: ["Термин", "Определение"]

  - title: "Перечень сокращений и обозначений"
    level: 1
    tables:
      - keyword: "Перечень сокращений и обозначений"
        columns: ["Сокращение", "Обозначение"]

  - title: "Общие положения"
    level: 1
    mandatory_phrases:
      - "Государственная информационная система: информационная система «ХХХ»"
    subsections:
      - title: "Область применения Системы"
        level: 2
        mandatory_phrases:
          - "Государственная информационная система: информационная система «ХХХ» предназначена"
      - title: "Краткое описание возможностей Системы"
        level: 2
        mandatory_phrases:
          - "В настоящем руководстве администратора рассмотрена подсистема «M»"
          - "Описание операций, выполняемых пользователями Системы, приведено в документе «Руководство пользователя»"
      - title: "Требования к квалификации администраторов"
        level: 2
        mandatory_phrases:
          - "Обслуживающий персонал включает в себя специалистов следующих категорий"
          - "системный администратор"
          - "администратор БД"
          - "администратор информационной безопасности"
      - title: "Перечень эксплуатационных документов, с которыми необходимо ознакомиться администратору"
        level: 2
        mandatory_phrases:
          - "Руководство администратора"
          - "Описание архитектуры системы"

  - title: "Назначение и условия применения"
    level: 1
    mandatory_phrases:
      - "Система предназначена для предоставления витрины программного обеспечения"
    subsections:
      - title: "Виды деятельности, функции, для автоматизации которых предназначена Система"
        level: 2
        mandatory_phrases:
          - "Полный список функций, автоматизируемых Системой в рамках Контракта"
      - title: "Условия, при соблюдении которых обеспечивается применение Системы"
        level: 2
        mandatory_phrases:
          - "Условием применения Системы является развернутый комплекс программно-технических средств Системы"
        subsections:
          - title: "Требования к программному обеспечению"
            level: 3
            mandatory_phrases:
              - "Для обеспечения работоспособности Системы необходимо установить СПО"
            tables:
              - keyword: "Комплект СПО"
                columns: ["№", "Категория", "Наименование", "Характеристики"]
            subsections:
              - title: "Требования к серверному программному обеспечению"
                level: 4
                mandatory_phrases:
                  - "Требования к СПО технологических платформ, на которых устанавливаются компоненты Системы"
                tables:
                  - keyword: "Требования к серверному программному обеспечению"
                    columns: ["№", "Имя ресурса", "Название системного ПО", "Производитель", "Версия", "Лицензионный параметр", "Кол-во"]
              - title: "Требования к клиентскому программному обеспечению"
                level: 4
                mandatory_phrases:
                  - "Для обеспечения возможности работы с клиентским ПО необходима установка на компьютерах пользователей следующих браузеров"
          - title: "Требования к техническому обеспечению"
            level: 3
            mandatory_phrases:
              - "Требования к техническому обеспечению технологических платформ"
            subsections:
              - title: "Требования к серверному техническому обеспечению"
                level: 4
                mandatory_phrases:
                  - "Требования к техническому обеспечению серверов, предназначенных для развертывания Системы"
                tables:
                  - keyword: "Требования к серверному техническому обеспечению"
                    columns: ["№", "Платформа", "Имя ресурса", "CPU (core)", "RAM, Гбайт", "Локальные диски, Гбайт", "Сетевые интерфейсы", "Интерфейсы сети хранения"]
              - title: "Требования к клиентскому техническому обеспечению"
                level: 4
                mandatory_phrases:
                  - "Требования к конфигурации технического обеспечения клиентской части"
                tables:
                  - keyword: "Требования к клиентскому техническому обеспечению"
                    columns: ["Оборудование", "Минимальная конфигурация"]

  - title: "Подготовка к работе"
    level: 1
    mandatory_phrases:
      - "Следующие пункты содержат описание процедур подготовки системного программного и технического обеспечения"
    subsections:
      - title: "Состав и содержание дистрибутивного носителя данных"
        level: 2
        mandatory_phrases:
          - "Дистрибутивный носитель содержит набор директорий с исходными кодами"
      - title: "Этапы установки"
        level: 2
        mandatory_phrases:
          - "Этапы: предустановочные проверки → установка на ВМ → развертывание в Kubernetes → настройка интеграций → проверка работоспособности"

  - title: "Порядок проверки в графическом интерфейсе"
    level: 1
    mandatory_phrases:
      - "Для проверки работоспособности Системы необходимо выполнить действия"
      - "Запустить веб-браузер"
    figures:
      - keyword: "Стартовая страница Системы с перечнем доступных систем"

  - title: "Описание операций администрирования"
    level: 1
    subsections:
      - title: "Описание общесистемных операций"
        level: 2
        subsections:
          - title: "Штатный запуск Системы"
            level: 3
          - title: "Штатная остановка Системы"
            level: 3
          - title: "Архивирование данных"
            level: 3
          - title: "Резервное копирование и восстановление Системы"
            level: 3
      - title: "Описание настройки работы с функциями администратора подсистемы «Название подсистемы»"
        level: 2

  - title: "Аварийные ситуации"
    level: 1
    mandatory_phrases:
      - "Функционирование Системы предусматривает три основных режима работы"
    subsections:
      - title: "Режимы работы Системы"
        level: 2
        mandatory_phrases:
          - "штатный режим"
          - "режим технического обслуживания"
          - "аварийный режим"
      - title: "Действия в случае несоблюдения условий выполнения технологического процесса, в том числе при длительных отказах технических средств"
        level: 2
        mandatory_phrases:
          - "При сбое, выходе из строя или при длительных отказах одного или нескольких основных средств"
      - title: "Действия по восстановлению программ и/или данных при отказе магнитных носителей или обнаружении ошибок в данных"
        level: 2
        mandatory_phrases:
          - "Для восстановления программ и/или данных при отказе магнитных носителей"
      - title: "Действия в случаях обнаружении несанкционированного вмешательства в данные"
        level: 2

  - title: "Рекомендации по освоению"
    level: 1
    mandatory_phrases:
      - "Для освоения установки и настройки Системы рекомендуется ознакомиться"